[project]
name = "jenkins-sample-ci"
version = "0.1.0"
description = "Sample Python project for Jenkins CI/CD demonstration with Ruff linting and Pytest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.ruff]
# Target Python version
target-version = "py310"

# Line length limit
line-length = 88

# Exclude typical build directories and virtual environments
exclude = [
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff.lint]
# Select rules:
# E/W: pycodestyle errors and warnings
# F: Pyflakes
# I: isort (import order)
# B: flake8-bugbear
# UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
