services:
  jenkins-controller:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
    group_add:
      - "0"
    volumes:
      # Persistent storage for Jenkins configurations, credentials, and job history
      - jenkins_data:/var/jenkins_home
      # Mount host Docker socket so Jenkins pipeline can spawn Docker container agents
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-net

volumes:
  jenkins_data:
    driver: local

networks:
  jenkins-net:
    driver: bridge
